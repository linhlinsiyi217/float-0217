name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "要加载的自部署站点地址（https://…）"
        required: false
        type: string
  push:
    branches: [main, 'trae/**']
    paths: ["android-shell/**", ".github/workflows/android-shell.yml"]

# 发布 Release 需要写权限（gh release create / delete）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 可选签名：仓库 Secrets 配置了 SHELL_KEYSTORE_BASE64 等四项时产出已签名 release
    env:
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 版本必须与根 build.gradle 里的 AGP 匹配：AGP 8.9 要求
      # Gradle 8.11.1 及以上。这两处是一对，改一处不改另一处必然失败。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore (optional)
        if: ${{ env.SHELL_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$SHELL_KEYSTORE_BASE64" | base64 -d > /tmp/shell.keystore
          echo "SHELL_KEYSTORE_FILE=/tmp/shell.keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        run: gradle -p android-shell assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-release
          path: android-shell/app/build/outputs/apk/release/*.apk

      # 只在 main 分支发布到 GitHub Release（tag = v<versionName>），
      # 其他分支（trae/**）只构建上传 Artifacts，方便检查不占正式发布位。
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 版本号唯一来源：android-shell/version.properties（与 build.gradle、网站 app-version.json 一致）
          VERSION_NAME=$(grep -oP '^versionName=\K.+' android-shell/version.properties | tr -d '\r')
          echo "versionName = $VERSION_NAME"
          # 有签名时输出 app-release.apk；没配签名时是 app-release-unsigned.apk
          APK=android-shell/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            APK=$(ls android-shell/app/build/outputs/apk/release/*.apk | head -n 1)
          fi
          cp "$APK" /tmp/app-release.apk
          gh release delete "v$VERSION_NAME" -y --cleanup-tag || true
          gh release create "v$VERSION_NAME" /tmp/app-release.apk \
            --title "v$VERSION_NAME" --notes "自动打包"
